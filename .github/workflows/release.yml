name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: berry-claw

jobs:
  npm-tarballs:
    name: npm tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: berry-claw
      - uses: actions/checkout@v4
        with:
          repository: Xiamu-ssr/berry-agent-sdk
          path: berry-agent-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            berry-agent-sdk/package-lock.json
            berry-claw/package-lock.json
      - run: npm ci
        working-directory: berry-agent-sdk
      - run: npm install --no-save --no-package-lock react@^19.1.0 react-dom@^19.1.0 lucide-react@^0.511.0 react-markdown@^10.1.0 react-syntax-highlighter@^15.6.1 remark-gfm@^4.0.1 @types/react@^19.1.0 @types/react-dom@^19.1.0 @types/react-syntax-highlighter@^15.5.13
        working-directory: berry-agent-sdk
      - run: npm run build
        working-directory: berry-agent-sdk
      - run: npm ci
      - run: npm run build
      - run: |
          mkdir -p release-assets
          npm pack --workspace=@berry-agent/claw-contracts --pack-destination release-assets
          npm pack --workspace=@berry-agent/claw-server --pack-destination release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: berry-claw/release-assets/*

  desktop:
    name: desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: berry-claw
      - uses: actions/checkout@v4
        with:
          repository: Xiamu-ssr/berry-agent-sdk
          path: berry-agent-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            berry-agent-sdk/package-lock.json
            berry-claw/package-lock.json
      - run: npm ci
        working-directory: berry-agent-sdk
      - run: npm install --no-save --no-package-lock react@^19.1.0 react-dom@^19.1.0 lucide-react@^0.511.0 react-markdown@^10.1.0 react-syntax-highlighter@^15.6.1 remark-gfm@^4.0.1 @types/react@^19.1.0 @types/react-dom@^19.1.0 @types/react-syntax-highlighter@^15.5.13
        working-directory: berry-agent-sdk
      - run: npm run build
        working-directory: berry-agent-sdk
      - run: npm ci
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            berry-claw/packages/desktop/dist/**/*.dmg
            berry-claw/packages/desktop/dist/**/*.zip
            berry-claw/packages/desktop/dist/**/*.exe
            berry-claw/packages/desktop/dist/**/*.AppImage
            berry-claw/packages/desktop/dist/**/*.deb
            berry-claw/packages/desktop/dist/**/*.rpm
          if-no-files-found: ignore

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: berry-claw
      - uses: actions/checkout@v4
        with:
          repository: Xiamu-ssr/berry-agent-sdk
          path: berry-agent-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            berry-agent-sdk/package-lock.json
            berry-claw/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: berry-agent-sdk
      - run: npm install --no-save --no-package-lock react@^19.1.0 react-dom@^19.1.0 lucide-react@^0.511.0 react-markdown@^10.1.0 react-syntax-highlighter@^15.6.1 remark-gfm@^4.0.1 @types/react@^19.1.0 @types/react-dom@^19.1.0 @types/react-syntax-highlighter@^15.5.13
        working-directory: berry-agent-sdk
      - run: npm run build
        working-directory: berry-agent-sdk
      - run: npm ci
      # capacitor's webDir is ../client/dist — it must exist BEFORE `cap add
      # android`, which copies the web assets at platform-add time. Build the
      # front-end first or `cap add` fails with "Could not find the web assets
      # directory". (apk:debug re-syncs, but add must succeed first.)
      - run: npm run build
      - run: npm -w @berry-agent/claw-mobile run add:android
      - run: npm -w @berry-agent/claw-mobile run apk:debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: berry-claw/packages/mobile/android/app/build/outputs/**/*.apk

  publish-release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [npm-tarballs, desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Upload release assets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="Berry Claw ${tag}"
          notes="Berry Claw ${tag}

          Includes npm tarballs, desktop client packages, and Android APK."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "$title" --notes "$notes" --prerelease
          fi

          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --clobber
          done
